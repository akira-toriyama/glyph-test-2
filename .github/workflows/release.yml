# .github/workflows/release.yml
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run: { description: "Preview only", type: boolean, default: false }
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write  # the draft
jobs:
  release:
    uses: akira-toriyama/glyph/.github/workflows/release.yml@b76m/release-caller  # dist2 probe: the README caller at the unit branch
    with:
      dry-run: ${{ github.event.inputs.dry_run == 'true' }}
      glyph-version: v6.1.0
